name: UrbanClap CI

on:
push:
branches:
- master
- "feat/**"
pull_request:
branches:
- master

jobs:
test:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install flask numpy joblib scikit-learn pytest

  - name: Run integration tests
    run: |
      pytest milestone_4/tests/test_api.py -v
```
